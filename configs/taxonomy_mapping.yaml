# CFPB <-> BANKING77 taxonomy crosswalk — Customer360 Navigator
# Master Execution Plan Section 6 (Integration Architecture) / Section 7 (BP1 Methodology, Gate 2)
#
# Source of truth:
#   - CFPB Product/Sub-product values: real value_counts() over data/raw/cfpb_complaints.csv
#     (1,048,575 data rows), measured 2026-09-21. See docs/data_dictionary/RAW_DATA_MANIFEST.md
#     and CFPB_BANKING77_TAXONOMY_MAPPING.md for the full distribution and rationale.
#   - BANKING77 category names: verbatim from data/external/banking77_categories.json (77 total).
#
# This is a documented judgment mapping (Gate 2 taxonomy engineering), not a statistical result.
# Every 'confidence' value below is a stated reasoning judgment — HIGH/MEDIUM/LOW — never invented
# as a computed metric. Do not treat this file as ground truth without Gate 2 human review.


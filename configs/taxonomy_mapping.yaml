common_taxonomy_buckets:
  CARD_ISSUANCE_AND_LIFECYCLE:
    cfpb_product_candidates:
      - "Credit card or prepaid card"
      - "Credit card"
      - "Prepaid card"
    cfpb_subproduct_candidates:
      - "General-purpose credit card or charge card"
      - "General-purpose prepaid card"
      - "Store credit card"
      - "Government benefit card"
    confidence: MEDIUM
    rationale: "BANKING77 categories about receiving/activating/losing/replacing a physical or virtual card map to CFPB's card-product family. CFPB does not separately code 'card lifecycle' as an Issue, so this is a product-level match only, not issue-level."
  CARD_PAYMENT_ISSUES:
    cfpb_product_candidates:
      - "Credit card or prepaid card"
      - "Credit card"
      - "Prepaid card"
    cfpb_subproduct_candidates:
      - "General-purpose credit card or charge card"
      - "General-purpose prepaid card"
    confidence: MEDIUM
    rationale: "Declined/failed/double-charged/fee-disputed card payments correspond to CFPB card-product complaints, but the specific CFPB Issue values for these rows have not yet been pulled and verified (Gate 2 follow-up) — confidence is capped at MEDIUM until that is done."
  ATM_CASH_WITHDRAWAL:
    cfpb_product_candidates:
      - "Checking or savings account"
      - "Credit card or prepaid card"
    cfpb_subproduct_candidates:
      - "Checking account"
      - "Savings account"
    confidence: LOW
    rationale: "CFPB does not have a dedicated ATM/cash-withdrawal product; ATM disputes are typically filed under the deposit-account product. This is an inference, not a confirmed CFPB coding rule — flagged LOW until cross-checked against real Issue values."
  TRANSFERS:
    cfpb_product_candidates:
      - "Money transfer, virtual currency, or money service"
      - "Checking or savings account"
    cfpb_subproduct_candidates:
      - "Domestic (US) money transfer"
      - "International money transfer"
    confidence: HIGH
    rationale: "CFPB's 'Money transfer, virtual currency, or money service' product is a direct, named match for BANKING77's transfer-related categories (sent/received/cancelled/declined/failed transfers, beneficiary and timing issues)."
  TOP_UP_AND_WALLET:
    cfpb_product_candidates:
      - "Money transfer, virtual currency, or money service"
    cfpb_subproduct_candidates:
      - "Mobile or digital wallet"
      - "Virtual currency"
    confidence: LOW
    rationale: "BANKING77's 'top up' categories describe adding funds to a digital wallet/prepaid account, a product type CFPB does not code with the same granularity. Mapped to the closest available CFPB sub-product as a judgment call, not a confirmed equivalence."
  FX_AND_EXCHANGE:
    cfpb_product_candidates:
      - "Money transfer, virtual currency, or money service"
    cfpb_subproduct_candidates:
      - "International money transfer"
      - "Virtual currency"
    confidence: LOW
    rationale: "Exchange-rate and currency-support categories have no precise CFPB analog in this product list; mapped to the money-transfer/virtual-currency product as the nearest defensible match."
  IDENTITY_AND_ACCOUNT_VERIFICATION:
    cfpb_product_candidates:
      - "Checking or savings account"
      - "Credit card or prepaid card"
    cfpb_subproduct_candidates:
      - "Checking account"
      - "Savings account"
    confidence: LOW
    rationale: "Identity verification, PIN, and passcode categories could plausibly appear under deposit-account or card-product complaints in CFPB, but no CFPB Issue value confirming this has been pulled yet — treat as an open hypothesis, not a verified mapping."
  FRAUD_AND_DISPUTES:
    cfpb_product_candidates:
      - "Credit card or prepaid card"
      - "Checking or savings account"
    cfpb_subproduct_candidates:
      - "General-purpose credit card or charge card"
      - "Checking account"
    confidence: MEDIUM
    rationale: "Lost/stolen-card, compromised-card, refund, and duplicate-charge categories align with CFPB's well-known 'fraud or scam' / 'problem with a purchase' issue family under card and deposit products, though the exact Issue strings have not yet been verified against this file."
  ACCOUNT_MANAGEMENT:
    cfpb_product_candidates:
      - "Checking or savings account"
      - "Credit card or prepaid card"
    cfpb_subproduct_candidates:
      - "Checking account"
      - "Savings account"
    confidence: MEDIUM
    rationale: "Account closure and balance-after-deposit categories map to CFPB's deposit-account and card-account product families."


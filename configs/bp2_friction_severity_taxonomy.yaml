# ------------------------------------------------------------------------------------------
# Severity taxonomy: 4 ordinal classes for genuinely resolved complaints, plus 2 excluded
# (non-ordinal) classes for rows that are not a real resolution outcome. Evaluated in the
# `precedence_order` sequence below — the FIRST matching rule wins per row. This precedence is
# itself a documented judgment call: `Timely response? == "No"` is checked before
# `Company response to consumer`, so a row that is both "Closed with monetary relief" AND
# untimely is classified HIGH_FRICTION, not LOW_FRICTION - untimeliness is treated as
# overriding evidence of friction regardless of the eventual resolution type. Gate 2's live
# crosstab (run by the Gate 2 notebook) checks whether "Untimely response" (Company response to
# consumer) and Timely response?=="No" ever disagree on the same row - they are two separately
# recorded real fields and are not assumed to be redundant.
# ------------------------------------------------------------------------------------------
precedence_order:
  - rule: "timely_response_no"
    condition: "Timely response? == 'No'"
    severity_class: "HIGH_FRICTION"
  - rule: "untimely_response_label"
    condition: "Company response to consumer == 'Untimely response'"
    severity_class: "HIGH_FRICTION"
  - rule: "in_progress"
    condition: "Company response to consumer == 'In progress'"
    severity_class: "EXCLUDED_PENDING"
  - rule: "closed_monetary_relief"
    condition: "Company response to consumer == 'Closed with monetary relief'"
    severity_class: "LOW_FRICTION"
  - rule: "closed_non_monetary_relief"
    condition: "Company response to consumer == 'Closed with non-monetary relief'"
    severity_class: "MEDIUM_FRICTION"
  - rule: "closed_with_explanation"
    condition: "Company response to consumer == 'Closed with explanation'"
    severity_class: "MEDIUM_HIGH_FRICTION"
  - rule: "null_company_response"
    condition: "Company response to consumer is null"
    severity_class: "EXCLUDED_UNKNOWN"

severity_classes:
  LOW_FRICTION:
    ordinal_rank: 0
    confidence: HIGH
    rationale: "'Closed with monetary relief' is CFPB's own explicit label for a complaint the
      company resolved by paying/refunding the consumer, AND the response was timely - the
      clearest real positive outcome recorded in this field. No judgment is required to identify
      this as the lowest-friction resolved class."
  MEDIUM_FRICTION:
    ordinal_rank: 1
    confidence: MEDIUM
    rationale: "'Closed with non-monetary relief' means the company took SOME corrective action
      (not simply an explanation), but the field does not disclose what kind or how substantial -
      it could range from a meaningful account correction to a token gesture. Ranked below
      LOW_FRICTION (no relief was monetary) and above MEDIUM_HIGH_FRICTION (some relief was still
      given, unlike explanation-only) as a judgment call, not a value the field states directly."
  MEDIUM_HIGH_FRICTION:
    ordinal_rank: 2
    confidence: MEDIUM
    rationale: "'Closed with explanation' means the company responded but the field records no
      relief of any kind - the complaint was closed without a corrective action being logged.
      Ranked as higher friction than either relief class on that basis. This is a judgment call:
      an explanation-only closure could also mean CFPB/the company genuinely found no fault, which
      this taxonomy does not have a real field to distinguish from an unresolved grievance -
      flagged for Gate 2 human review, not resolved here."
  HIGH_FRICTION:
    ordinal_rank: 3
    confidence: HIGH
    rationale: "Either the real 'Timely response?' field is explicitly 'No', or 'Company response
      to consumer' is explicitly 'Untimely response' - both are CFPB's own unambiguous negative
      signal (the company did not respond in time), independent of whatever resolution type was
      eventually recorded. No judgment is required to identify this as the highest-friction class."

excluded_classes:
  EXCLUDED_PENDING:
    reason: "'In progress' (22.11% of the real extract - not a small residual) is not a resolution
      outcome, it is a right-censored/pending status - the eventual real outcome for these rows is
      unknown at extraction time. Including it as an ordinal severity class would conflate
      'unresolved so far' with an actual severity determination. Excluded from the trainable
      target for Gate 3; RAW_DATA_MANIFEST.md Finding 4 (this extract appears date-ordered
      most-recent-first) means these rows likely skew toward the most recent complaints, which is
      flagged as a real assumption/limitation for Gate 3/6 reporting, not silently resolved here."
  EXCLUDED_UNKNOWN:
    reason: "2 rows (0.0002% of the extract) have a null 'Company response to consumer' value and
      a Timely response? that is not 'No' (otherwise the timely_response_no rule above would have
      already classified them HIGH_FRICTION). Negligible row count - excluded from the trainable
      target rather than guessed."


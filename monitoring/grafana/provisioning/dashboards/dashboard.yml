# Customer360 Navigator - Grafana dashboard provisioning (Priority 3 addition, 2026-09-26).
# Auto-loads every dashboard JSON file under monitoring/grafana/dashboards/ (mounted read-only at
# /var/lib/grafana/dashboards by docker-compose.monitoring.yml) on Grafana startup - no manual
# "Import dashboard" step.
apiVersion: 1

providers:
  - name: "Customer360 Navigator"
    orgId: 1
    folder: "Customer360 Navigator"
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards

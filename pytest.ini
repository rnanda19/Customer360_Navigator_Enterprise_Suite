[pytest]
; Customer360 Navigator Enterprise Suite - BP1 Gate 6 (Productization, Monitoring & Governance).
; Every test under tests/ imports project modules as `from utils...`, `from taxonomy...`,
; `from models...` - exactly how every BP notebook imports them after its own
; `sys.path.insert(0, str(PROJECT_ROOT / "src"))` (PROJECT_STRUCTURE_LOCKED.md rule #3). This
; option makes `pytest tests/ -v`, run from the project root exactly as .github/workflows/ci.yml
; does it, resolve those imports without every test file needing its own sys.path hack.
pythonpath = src
testpaths = tests

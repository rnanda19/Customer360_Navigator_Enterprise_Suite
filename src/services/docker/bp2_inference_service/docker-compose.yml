# Customer360 Navigator - BP2 Customer Friction Classification inference service
# Run from the project ROOT (this file's build context matches the Dockerfile's - see its header):
#   docker compose -f src/services/docker/bp2_inference_service/docker-compose.yml up --build
# Then: curl http://localhost:8002/health

services:
  bp2-inference-service:
    build:
      context: ../../../..
      dockerfile: src/services/docker/bp2_inference_service/Dockerfile
    image: c360-bp2-inference-service:latest
    container_name: c360-bp2-inference-service
    ports:
      - "8002:8002"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8002/health', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

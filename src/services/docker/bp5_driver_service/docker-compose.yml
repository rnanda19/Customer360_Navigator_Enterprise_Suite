# Customer360 Navigator - BP5 Root-Cause & Driver Analytics reporting service
# Run from the project ROOT (this file's build context matches the Dockerfile's - see its header):
#   docker compose -f src/services/docker/bp5_driver_service/docker-compose.yml up --build
# Then: curl http://localhost:8005/health

services:
  bp5-driver-service:
    build:
      context: ../../../..
      dockerfile: src/services/docker/bp5_driver_service/Dockerfile
    image: c360-bp5-driver-service:latest
    container_name: c360-bp5-driver-service
    ports:
      - "8005:8005"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8005/health', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

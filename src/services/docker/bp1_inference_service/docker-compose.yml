# Customer360 Navigator - BP1 Customer Intent Classification inference service
# Run from the project ROOT (this file's build context matches the Dockerfile's - see its header):
#   docker compose -f src/services/docker/bp1_inference_service/docker-compose.yml up --build
# Then: curl http://localhost:8001/health
#
# C360_API_KEY is REQUIRED at run time (real API-key auth on all 7 services - see
# SECURITY.md). / and /health stay open with no key; every other endpoint needs it,
# e.g.: curl -H "X-API-Key: $C360_API_KEY" http://localhost:8001/...

services:
  bp1-inference-service:
    build:
      context: ../../../..
      dockerfile: src/services/docker/bp1_inference_service/Dockerfile
    image: c360-bp1-inference-service:latest
    container_name: c360-bp1-inference-service
    ports:
      - "8001:8001"
    environment:
      - C360_API_KEY=${C360_API_KEY:?C360_API_KEY must be set - see .env.example}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

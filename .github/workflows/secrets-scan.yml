name: Secret Scanning

# Phase J (security) - Master Engineering Directive. Scans every push/PR for hardcoded
# credentials, API keys, and tokens committed to this repo, using gitleaks
# (https://github.com/gitleaks/gitleaks) via its official Action. This repository is owned by a
# personal GitHub account, not an organization, so per gitleaks-action's own documented
# licensing terms (github.com/gitleaks/gitleaks-action: "If you are scanning repos that belong
# to a personal account, then no license key is required" - GITLEAKS_LICENSE is "required for
# organizations, not required for user accounts") this runs with no license key and no cost.
# fetch-depth: 0 is required so gitleaks scans full commit history, not just the current
# checkout - a secret committed and later removed is still a real, disclosed secret.
on: [push, pull_request]
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

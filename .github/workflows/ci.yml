name: CI

# Split 2026-09-26: this workflow now covers real pytest execution + notebook syntax checks
# only. Linting/formatting/static-security moved to code-quality.yml, and Docker
# build+run+health verification moved to docker-verify.yml (see each file's own header comment)
# - each now carries its own honest, separate badge instead of everything folding into one "CI"
# status.
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      # Hygiene pass (2026-09-26): real coverage reporting (pytest-cov, already a declared
      # requirements.txt dependency) - printed to the run's own step summary so it's visible
      # without opening a separate artifact, and to a Cobertura XML for any future consumer.
      # No --cov-fail-under gate yet: gating at an invented percentage before a real baseline
      # coverage number has ever been observed would be exactly the kind of unearned claim this
      # project's own zero-fabrication standard exists to rule out (see BP3's disparate-impact
      # disclosure for the same principle applied elsewhere). Once a real run reports the actual
      # number, a threshold can be set from that number - never guessed in advance.
      - run: |
          pytest tests/ -v --cov=src --cov-report=term-missing --cov-report=xml | tee pytest_report.txt
          echo "## Coverage report (informational - no gate yet, see ci.yml comment)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -A 200 "^Name " pytest_report.txt >> "$GITHUB_STEP_SUMMARY" || tail -n 30 pytest_report.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
  notebook-syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      # nbformat/pyflakes pinned in requirements.txt (2026-09-26): scripts/check_notebook_syntax.py
      # itself had never actually been committed until now - this step and the Makefile's
      # `notebook-check` target were both silent no-ops (the missing-file error was swallowed by
      # `|| true`) despite reporting green on every prior run.
      - run: pip install nbformat==5.11.1 pyflakes==4.0.0
      # Real baseline now confirmed clean (66/66 notebooks, 2026-09-26) - promoted to a real,
      # blocking gate rather than staying `|| true` forever, since a soft gate that never goes
      # red once a script exists again defeats the point of restoring it.
      - run: python scripts/check_notebook_syntax.py
